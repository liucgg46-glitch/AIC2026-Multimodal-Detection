<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boat 标签人工复核包</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #101827; color: #e8eef7; }
    header { padding: 14px 20px; border-bottom: 1px solid #314057; display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
    h1 { font-size: 20px; margin: 0; }
    header small { color: #a8bad1; }
    button, select, input, textarea { font: inherit; }
    button { background: #274568; border: 1px solid #4d739a; color: #fff; padding: 7px 11px; border-radius: 6px; cursor: pointer; }
    button:hover { background: #365e89; }
    button.active { background: #735718; border-color: #efc15a; }
    .layout { display: grid; grid-template-columns: 245px minmax(0, 1fr) 370px; height: calc(100vh - 68px); }
    aside { overflow: auto; border-right: 1px solid #314057; padding: 12px; }
    aside.right { border-right: 0; border-left: 1px solid #314057; }
    .controls { display: grid; gap: 8px; margin-bottom: 12px; }
    input, select, textarea { width: 100%; background: #16243a; color: #e8eef7; border: 1px solid #4b607b; border-radius: 5px; padding: 7px; }
    textarea { min-height: 100px; resize: vertical; }
    .image-list { display: grid; gap: 4px; }
    .image-list button { text-align: left; overflow-wrap: anywhere; }
    .image-list small { display: block; color: #b8c8db; }
    main { overflow: auto; padding: 14px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .canvas-wrap { background: #070b11; border: 1px solid #43516a; display: flex; justify-content: center; }
    canvas { max-width: 100%; height: auto; cursor: crosshair; }
    .hint { color: #d6c184; background: #302a19; padding: 8px; border-radius: 5px; margin: 10px 0; }
    .muted { color: #a8bad1; }
    .box-card { border: 1px solid #43516a; border-radius: 6px; padding: 10px; margin: 8px 0; cursor: pointer; }
    .box-card.selected { border-color: #ffcf50; background: #28291e; }
    .box-card code { display: block; color: #b9d7f6; overflow-wrap: anywhere; margin-top: 5px; }
    label { display: block; margin: 10px 0 4px; font-weight: 600; }
    .legend { font-size: 13px; line-height: 1.6; }
    .gold { color: #ffcf50; } .cyan { color: #59d7e3; }
    @media (max-width: 1100px) { .layout { grid-template-columns: 180px minmax(0, 1fr); } aside.right { grid-column: 1 / -1; border-top: 1px solid #314057; } }
  </style>
</head>
<body>
  <header>
    <h1>Class-1 boat 标签复核</h1>
    <small id="progress"></small>
    <button id="exportButton" type="button">导出填写后的 review.csv</button>
    <small>只编辑本页副本；不会写回原始或 clean 标签。离开页面前请导出 CSV。</small>
  </header>
  <div class="layout">
    <aside>
      <div class="controls">
        <input id="search" type="search" placeholder="搜索 stem">
        <select id="splitFilter"><option value="all">全部 train + val</option><option value="train">train</option><option value="val">val</option></select>
        <label><input id="flagFilter" type="checkbox" style="width:auto"> 只看 R8 有模型分歧的图</label>
      </div>
      <div id="imageList" class="image-list"></div>
    </aside>
    <main>
      <div class="toolbar"><div><strong id="imageTitle"></strong><div id="imageMeta" class="muted"></div></div><div><button id="prevButton" type="button">上一张</button> <button id="nextButton" type="button">下一张</button></div></div>
      <div class="canvas-wrap"><canvas id="canvas"></canvas></div>
      <p class="legend"><span class="gold">■</span> boat 当前框；<span class="cyan">■</span> 其他类别当前框。框旁数字是 <strong>labels_clean 文件的 1-based 行号</strong>。点击 boat 框或右侧条目填写审查决定。bbox 完整原文见右侧。</p>
    </main>
    <aside class="right">
      <h2 style="margin:0 0 6px;font-size:18px">当前图像的 boat 框</h2>
      <div id="boatCards"></div>
      <div id="editor"></div>
    </aside>
  </div>
  <script id="review-data" type="application/json">__REVIEW_DATA_JSON__</script>
  <script>
    "use strict";
    const data = JSON.parse(document.getElementById("review-data").textContent);
    const images = data.images;
    const rows = data.review_rows;
    const byKey = new Map(rows.map(r => [r.stem + ":" + r.row_index, r]));
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    let current = 0;
    let selectedKey = null;
    let loadedImage = null;
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]);
    const keyOf = (stem, row) => stem + ":" + row;
    function filteredIndices() {
      const query = document.getElementById("search").value.trim().toLowerCase();
      const split = document.getElementById("splitFilter").value;
      const flagged = document.getElementById("flagFilter").checked;
      return images.map((_, i) => i).filter(i =>
        images[i].stem.toLowerCase().includes(query) &&
        (split === "all" || images[i].split === split) &&
        (!flagged || images[i].r8_flag_count > 0));
    }
    function updateProgress() {
      const reviewed = rows.filter(r => r.decision !== "unreviewed").length;
      document.getElementById("progress").textContent = `${images.length} 张图 · ${rows.length} 个 boat 框 · 已决定 ${reviewed}`;
    }
    function renderList() {
      const list = document.getElementById("imageList");
      list.innerHTML = "";
      for (const index of filteredIndices()) {
        const item = images[index];
        const button = document.createElement("button");
        button.type = "button";
        button.className = index === current ? "active" : "";
        button.innerHTML = `${esc(item.stem)}<small>${esc(item.split)} · ${item.boat_count} 框${item.r8_flag_count ? " · ⚑ R8" : ""}</small>`;
        button.onclick = () => selectImage(index);
        list.append(button);
      }
      if (!list.children.length) list.textContent = "筛选后没有图像";
    }
    function selectImage(index) {
      current = index;
      const item = images[current];
      const boat = item.boxes.filter(b => b.class_id === 1);
      selectedKey = keyOf(item.stem, boat[0].row_index);
      loadedImage = null;
      document.getElementById("imageTitle").textContent = item.stem;
      document.getElementById("imageMeta").textContent = `${item.split} · ${item.image_file} · ${boat.length} 个 boat 框`;
      const image = new Image();
      image.onload = () => { loadedImage = image; canvas.width = image.naturalWidth; canvas.height = image.naturalHeight; draw(); };
      image.onerror = () => { document.getElementById("imageMeta").textContent += " · 图片加载失败"; };
      image.src = "images/" + encodeURIComponent(item.image_file);
      renderList(); renderCards(); renderEditor();
    }
    function draw() {
      if (!loadedImage) return;
      const item = images[current];
      ctx.drawImage(loadedImage, 0, 0);
      ctx.lineWidth = Math.max(3, canvas.width / 480);
      ctx.font = `${Math.max(18, canvas.width / 90)}px system-ui`;
      for (const box of item.boxes) {
        const [xc, yc, w, h] = box.bbox;
        const x = (xc - w / 2) * canvas.width, y = (yc - h / 2) * canvas.height;
        const bw = w * canvas.width, bh = h * canvas.height;
        const isSelected = keyOf(item.stem, box.row_index) === selectedKey;
        ctx.strokeStyle = isSelected ? "#ff4d55" : box.class_id === 1 ? "#ffcf50" : "#59d7e3";
        ctx.lineWidth = isSelected ? Math.max(6, canvas.width / 300) : Math.max(3, canvas.width / 480);
        ctx.strokeRect(x, y, bw, bh);
        const text = `#${box.row_index} ${box.class_id} ${box.class_name}`;
        const textWidth = ctx.measureText(text).width + 12;
        const labelY = y >= 30 ? y - 27 : y + 2;
        ctx.fillStyle = "rgba(5, 15, 28, 0.88)";
        ctx.fillRect(Math.max(0, x), Math.max(0, labelY), textWidth, 27);
        ctx.fillStyle = isSelected ? "#ff4d55" : box.class_id === 1 ? "#ffcf50" : "#59d7e3";
        ctx.fillText(text, Math.max(0, x) + 5, Math.max(0, labelY) + 21);
      }
    }
    function renderCards() {
      const item = images[current];
      const holder = document.getElementById("boatCards");
      holder.innerHTML = "";
      for (const box of item.boxes.filter(b => b.class_id === 1)) {
        const row = byKey.get(keyOf(item.stem, box.row_index));
        const card = document.createElement("div");
        card.className = "box-card" + (keyOf(item.stem, box.row_index) === selectedKey ? " selected" : "");
        card.innerHTML = `<strong>行 #${box.row_index} · class ${box.class_id} ${esc(box.class_name)}</strong><code>bbox: ${esc(box.bbox_text)}</code><small>决定: ${esc(row.decision)}${row.r8_reason ? " · R8: " + esc(row.r8_reason) : ""}</small>`;
        card.onclick = () => { selectedKey = keyOf(item.stem, box.row_index); renderCards(); renderEditor(); draw(); };
        holder.append(card);
      }
    }
    function renderEditor() {
      const row = byKey.get(selectedKey);
      const editor = document.getElementById("editor");
      if (!row) { editor.innerHTML = ""; return; }
      const options = ["unreviewed", "keep", "relabel", "adjust_bbox", "relabel_and_adjust", "remove", "unsure"];
      editor.innerHTML = `<div class="hint">行 #${row.row_index} · 原始 class=1 boat<br>原始 bbox: ${esc(row.original_bbox)}<br>${row.r8_reason ? "R8 提示: " + esc(row.r8_reason) + (row.r8_other_class_id !== "" ? "，邻近预测 class=" + esc(row.r8_other_class_id) + "，IoU=" + Number(row.r8_other_class_iou).toFixed(3) : "") : "R8 无低置信度漏检提示（train 图或已匹配）"}</div>` +
        `<label for="decision">decision</label><select id="decision">${options.map(x => `<option value="${x}" ${row.decision === x ? "selected" : ""}>${x}</option>`).join("")}</select>` +
        `<label for="proposedClass">proposed_class（留空表示不改）</label><select id="proposedClass"><option value="">— 留空 —</option>${data.class_names.map((name, i) => `<option value="${i}" ${String(row.proposed_class) === String(i) ? "selected" : ""}>${i} ${esc(name)}</option>`).join("")}</select>` +
        `<label for="proposedBBox">proposed_bbox（x y w h，留空表示不改）</label><input id="proposedBBox" value="${esc(row.proposed_bbox)}" placeholder="${esc(row.original_bbox)}">` +
        `<label for="rationale">visual_rationale</label><textarea id="rationale" placeholder="写下图像证据、边界判断和不确定性">${esc(row.visual_rationale)}</textarea>`;
      for (const [id, field] of [["decision", "decision"], ["proposedClass", "proposed_class"], ["proposedBBox", "proposed_bbox"], ["rationale", "visual_rationale"]]) {
        document.getElementById(id).addEventListener("input", event => {
          row[field] = event.target.value;
          if (field === "decision") { updateProgress(); renderCards(); }
        });
      }
    }
    canvas.addEventListener("click", event => {
      if (!loadedImage) return;
      const rect = canvas.getBoundingClientRect();
      const px = (event.clientX - rect.left) * canvas.width / rect.width;
      const py = (event.clientY - rect.top) * canvas.height / rect.height;
      const matches = images[current].boxes.filter(b => b.class_id === 1).filter(b => {
        const [xc, yc, w, h] = b.bbox;
        return px >= (xc-w/2)*canvas.width && px <= (xc+w/2)*canvas.width &&
               py >= (yc-h/2)*canvas.height && py <= (yc+h/2)*canvas.height;
      }).sort((a, b) => a.bbox[2]*a.bbox[3] - b.bbox[2]*b.bbox[3]);
      if (matches.length) { selectedKey = keyOf(images[current].stem, matches[0].row_index); renderCards(); renderEditor(); draw(); }
    });
    function move(delta) {
      const filtered = filteredIndices();
      if (!filtered.length) return;
      const pos = filtered.indexOf(current);
      selectImage(filtered[(pos + delta + filtered.length) % filtered.length]);
    }
    document.getElementById("prevButton").onclick = () => move(-1);
    document.getElementById("nextButton").onclick = () => move(1);
    for (const id of ["search", "splitFilter", "flagFilter"]) document.getElementById(id).addEventListener("input", renderList);
    document.getElementById("exportButton").onclick = () => {
      const quote = value => `"${String(value ?? "").replaceAll('"', '""')}"`;
      const csv = [data.review_fields.join(","), ...rows.map(row => data.review_fields.map(field => quote(row[field])).join(","))].join("\r\n") + "\r\n";
      const blob = new Blob(["\ufeff", csv], {type:"text/csv;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a"); link.href = url; link.download = "boat_review_completed.csv"; link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };
    updateProgress(); selectImage(0);
  </script>
</body>
</html>
